<!DOCTYPE html>

        }

        }

        }
        /*display: flex:
        - justify-content: ( căn theo chiều ngang)

        2 câu lệnh này luôn đi với nhau
        https://flexboxfroggy.com/#vi 
        */

    </style>
</head>
<body>
