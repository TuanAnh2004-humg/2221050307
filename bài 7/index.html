<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 7 - JavaScript</title>
</head>
<body>
    <!-- Internal JavaScript -->
    <script>
        //Có thể thêm mã nguồn html vào trong JS
        //Lưu ý: html phải đặt trong dấu " "
        document.writeln("Hello <br> World!");

        var tenSinhVien = "Ngọc Nhi";
        var tuoi = 20;
        document.writeln(tenSinhVien + "<br>" + tuoi + "<br>");

        var soThuNhat = 10;
        var soThuHai = 5;
        // + - * /
        // % chia lấy phần dư
        var ketQua = soThuNhat + soThuHai;
        document.writeln("Kết quả là " + ketQua);

        var ketQua = soThuNhat * soThuHai;
        document.writeln("Kết quả là " + ketQua);

        // ++ --
        document.writeln(++soThuNhat);
        document.writeln(--soThuNhat);

        // += -= *= /= %=
        //Tương đương: soThuNhat = soThuNhat + soThuHai
        soThuNhat+=soThuHai
        document.writeln(soThuNhat);

        //Kiểu dữ liệu
        //string
        //Number Số
        //boolean (true/false)

        var a = "10";
        var b = "5";
        //Chuyển string => number dùng: parseInt()
        var tong = parseInt(a) + parseInt(b);
        document.writeln(tong);

        var a = "10";
        var b = "5.5";
        //Chuyển string => số thực dùng: parseFloat()
        var tong = parseInt(a) + parseFloat(b);
        document.writeln(tong);

        //String
        document.writeln("<br>");
        //Kiểm tra độ dài chuỗi length
        document.writeln(tenSinhVien.length);

        //Nối chuỗi +

        //Kiểm tra tồn tại
        //indexOf: Tìm vị trí xuất hiện đầu tiên (có - vị trí/ k có -1)
        document.writeln("<br>");
        document.writeln(tenSinhVien.indexOf("i"));

        //includes: Kiểm tra xem từ có trong chuỗi không? Có = True / Không = False
        document.writeln("<br>");
        document.writeln(tenSinhVien.includes("n"));

        //replace (thay thế chuỗi)
        document.writeln("<br>");
        document.writeln(tenSinhVien.replace("Ngọc", "Thanh"));
        tenSinhVien = tenSinhVien.replace("Ngọc", "Thanh");
        document.writeln(tenSinhVien)

        //Kiểm tra ký tự bắt đầu
        //StartsWith
        document.writeln("<br>");
        document.writeln(tenSinhVien.startsWith("Ngọc"));

        //Viết in hoa
        document.writeln("<br>");
        document.writeln(tenSinhVien.toUpperCase());

        //Viết thường 
        document.writeln("<br>");
        document.writeln(tenSinhVien.toLowerCase());

        //Number
        //Kiểm tra dữ liệu có phải số hay không?
        //var a = "10";
        //var so = 20;

        //var kq = isNaN();
        //document.writeln();
        var kq = typeof(so);
        document.writeln();

        //Date
        var homNay = new Date();
        document.writeln("<br>");
        document.writeln(homNay);

        //tháng/ngày/năm
        var ngay = new Date("10/20/2026");
        document.writeln("<br>");
        document.writeln(ngay);

        //Lấy năm
        var nam = homNay.getFullYear();
        document.writeln("<br>");
        document.writeln(nam);

        //Lấy tháng
        var thang = homNay.getMonth() + 1;
        document.writeln("<br>");
        document.writeln(thang);

        //Lấy ngày
        var ngay = homNay.getDate();
        document.writeln("<br>");   
        document.writeln(ngay);

        //Lấy thứ
        var thu = homNay.getDay();
        document.writeln("<br>");
        document.writeln(thu);

        var namSinhNhi = nam - tuoi;
        document.writeln("<br>");
        document.writeln("Nhi sinh năm " + namSinhNhi);

        //Mảng (array): thứ tự 0 1 2 3 4 ....
        var mangSo = [1, 2, 3, 4, 5];
        var mangTen = ["Ánh", "Nhi", "Thảo"];
        var thongTin = ["Nhi", 20, false];

        document.writeln("<br>");
        document.writeln(mangSo[2]);

        document.writeln("<br>");
        document.writeln(mangTen[1]);

        document.writeln("<br>");
        document.writeln(thongTin[0]);  

        //Kiểm tra mảng length
        document.writeln("<br>");
        document.writeln(mangSo.length);
        
        document.write("<br>");
        var diem = 7; 
        if (diem >= 8) {
        document.writeln("A");
        } else {
        if (diem >= 6.5) {
        document.writeln("B");
        } else {
        if (diem >= 4) {
            document.writeln("C");
        } else {
            document.writeln("F");
        }
        }
        }


        //object : var name = {}
        var thongTinSinhVien = {
            hoTen: "Bùi Tuấn Anh",
            tuoi : 21,
            gioiTinh: true,
            diaChi: {
                thanhPho: "Hà Nội",
                phuong: "Dong Ngac",
                duong: "Le Van Hien"
            }
        };

        var phim = {
            ten: "Avenger",
            namSanXuat: 2019,
            theLoai: ["Hành Động", "Viễn Tưởng"],
            daXem: true
        };

        document.writeln("<br>"+ thongTinSinhVien.gioiTinh +"<br>"+ phim.theLoai[1]+ "<br>");

        // switch case
        var d = new Date();
        var theDay = d.getDay();
        switch(theDay){
            case 5:
            document.writeln("Hôm nay là thứ 5");
            break;
            case 6:
            document.writeln("Hôm nay là thứ 6");
            break;
            case 0:
            document.writeln("Hôm nay là chủ nhật");
            break;
            default:
            document.writeln("Hôm nay là thứ " + theDay);
        }

       // for: vòng lặp
       for(var index = 1; index <= 10; index++){
        document.writeln("<br> xin chào" + index);
    }
        var danhSachSinhVien = ["Nguyen Van A", "Nguyen Van B", "Nguyen Van C","D", "E", "F"];
        document.write( danhSachSinhVien [0]);
        for(var i = 0; i < danhSachSinhVien.length; i++){
        document.write("<br>" + danhSachSinhVien[i]);
        if(danhSachSinhVien[i] == "D"){
            document.write("<br>"+ "toi la"+ danhSachSinhVien[i]);
        }
    }
    // popup boxes
    alert("xin chào ");

    // comfirm
    var r = confirm("bạn muốn thoát không?");
    if(r == true){
        document.write("đã thoát");
    }else{
        document.write(" ở lại");
    }
    //promt
    r = prompt("Nhập vào họ tên", "nhập tên vào đây");
    document.write(r);

    </script>

</body>
</html>
